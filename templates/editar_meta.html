{% extends 'base.html' %}
{% block title %}Editar Meta - Meu Financeiro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

        <div class="d-flex align-items-center gap-2 mb-3">
            <a href="{{ url_for('listar_metas') }}" class="btn btn-outline-light btn-sm" style="border-radius:999px;padding:0.375rem 0.75rem;">
                <i class="bi bi-arrow-left" style="font-size:0.85rem;"></i>
            </a>
            <h1 style="font-size:1.3rem;margin:0;">Editar Meta</h1>
        </div>

        <div class="card p-3 animate-in">
            <form action="{{ url_for('editar_meta_salvar', id=meta.id) }}" method="POST" data-submit-feedback>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Nome da Meta *</label>
                    <input type="text" class="form-control" name="nome" required value="{{ meta.nome }}">
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label">Objetivo (R$) *</label>
                        <input type="text" inputmode="numeric" data-currency-input class="form-control"
                               name="valor_objetivo" required value="{{ meta.valor_objetivo }}">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Valor Atual (R$)</label>
                        <input type="text" inputmode="numeric" data-currency-input data-currency-min="0" class="form-control"
                               name="valor_atual" value="{{ meta.valor_atual }}">
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label">Data Limite *</label>
                        <input type="date" class="form-control" name="data_limite"
                               required value="{{ meta.data_limite.isoformat() }}">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Prioridade *</label>
                        <select class="form-select" name="prioridade">
                            <option value="baixa" {{ 'selected' if meta.prioridade == 'baixa' }}>🟢 Baixa</option>
                            <option value="media" {{ 'selected' if meta.prioridade == 'media' }}>🟡 Média</option>
                            <option value="alta" {{ 'selected' if meta.prioridade == 'alta' }}>🔴 Alta</option>
                        </select>
                    </div>
                </div>

<details class="form-details mb-3"><summary>Mais detalhes <small>Ícone e observação</small></summary>
                <div class="mb-3">
                    <label class="form-label">Ícone</label>
                    <select class="form-select" name="icone">
                        <option value="bi-house" {{ 'selected' if meta.icone == 'bi-house' }}>🏠 Casa</option>
                        <option value="bi-car-front" {{ 'selected' if meta.icone == 'bi-car-front' }}>🚗 Veículo</option>
                        <option value="bi-airplane" {{ 'selected' if meta.icone == 'bi-airplane' }}>✈️ Viagem</option>
                        <option value="bi-mortarboard" {{ 'selected' if meta.icone == 'bi-mortarboard' }}>🎓 Educação</option>
                        <option value="bi-heart-pulse" {{ 'selected' if meta.icone == 'bi-heart-pulse' }}>🏥 Saúde</option>
                        <option value="bi-shield-check" {{ 'selected' if meta.icone == 'bi-shield-check' }}>🛡️ Reserva</option>
                        <option value="bi-graph-up-arrow" {{ 'selected' if meta.icone == 'bi-graph-up-arrow' }}>📈 Investimento</option>
                        <option value="bi-star" {{ 'selected' if meta.icone == 'bi-star' }}>⭐ Geral</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Observação</label>
                    <textarea class="form-control" name="observacao" rows="2">{{ meta.observacao or '' }}</textarea>
                </div>

</details>
                <button type="submit" class="btn btn-primary w-100 py-2" style="border-radius:999px;">
                    <i class="bi bi-save me-1"></i> Salvar Alterações
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
