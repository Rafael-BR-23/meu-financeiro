{% extends 'base.html' %}
{% block title %}Nova Meta - Meu Financeiro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

        <div class="d-flex align-items-center gap-2 mb-3">
            <a href="{{ url_for('listar_metas') }}" class="btn btn-outline-light btn-sm" style="border-radius:999px;padding:0.375rem 0.75rem;">
                <i class="bi bi-arrow-left" style="font-size:0.85rem;"></i>
            </a>
            <h1 style="font-size:1.3rem;margin:0;">Nova Meta</h1>
        </div>

        <div class="card p-3 animate-in">
            <form action="{{ url_for('nova_meta_salvar') }}" method="POST" data-submit-feedback>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Nome da Meta *</label>
                    <input type="text" class="form-control" name="nome" required placeholder="ex: Viagem, Reserva de Emergência...">
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label">Objetivo (R$) *</label>
                        <input type="text" inputmode="numeric" data-currency-input class="form-control" name="valor_objetivo" required placeholder="0,00">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Valor Inicial (R$)</label>
                        <input type="text" inputmode="numeric" data-currency-input data-currency-min="0" class="form-control" name="valor_atual" value="0" placeholder="0,00">
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label">Data Limite *</label>
                        <input type="date" class="form-control" name="data_limite" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Prioridade *</label>
                        <select class="form-select" name="prioridade">
                            <option value="baixa">🟢 Baixa</option>
                            <option value="media" selected>🟡 Média</option>
                            <option value="alta">🔴 Alta</option>
                        </select>
                    </div>
                </div>

<details class="form-details mb-3"><summary>Mais detalhes <small>Ícone e observação</small></summary>
                <div class="mb-3">
                    <label class="form-label">Ícone</label>
                    <select class="form-select" name="icone">
                        <option value="bi-house">🏠 Casa</option>
                        <option value="bi-car-front">🚗 Veículo</option>
                        <option value="bi-airplane">✈️ Viagem</option>
                        <option value="bi-mortarboard">🎓 Educação</option>
                        <option value="bi-heart-pulse">🏥 Saúde</option>
                        <option value="bi-shield-check">🛡️ Reserva</option>
                        <option value="bi-graph-up-arrow">📈 Investimento</option>
                        <option value="bi-star" selected>⭐ Geral</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Observação</label>
                    <textarea class="form-control" name="observacao" rows="2" placeholder="Detalhes adicionais..."></textarea>
                </div>

</details>
                <button type="submit" class="btn btn-primary w-100 py-2" style="border-radius:999px;">
                    <i class="bi bi-trophy me-1"></i> Criar Meta
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
