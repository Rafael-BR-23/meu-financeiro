{% extends 'base.html' %}

{% block title %}Editar conta - Meu Financeiro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

        <div class="d-flex align-items-center gap-2 mb-3">
            <a href="{{ url_for('listar_pendencias') }}" class="btn btn-outline-light btn-sm" style="border-radius:999px;padding:0.375rem 0.75rem;">
                <i class="bi bi-arrow-left" style="font-size:0.85rem;"></i>
            </a>
            <h1 style="font-size:1.3rem;margin:0;">Editar conta</h1>
        </div>

        <div class="card p-3">
            <form action="{{ url_for('editar_pendencia_salvar', id=pendencia.id) }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Credor *</label>
                    <input type="text" class="form-control" name="credor" value="{{ pendencia.credor }}" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-12 col-sm-6">
                        <label class="form-label">Valor (R$) *</label>
                        <input type="text" inputmode="numeric" data-currency-input class="form-control" name="valor" value="{{ pendencia.valor }}" required>
                    </div>
                    <div class="col-12 col-sm-6">
                        <label class="form-label">Vencimento *</label>
                        <input type="date" class="form-control" name="data_vencimento" value="{{ pendencia.data_vencimento.isoformat() if pendencia.data_vencimento else '' }}" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Observação</label>
                    <textarea class="form-control" name="observacao" rows="2">{{ pendencia.observacao or '' }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2" style="border-radius:999px;">
                    <i class="bi bi-save me-1"></i> Salvar Alterações
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
