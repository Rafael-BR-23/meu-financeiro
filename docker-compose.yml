services:
  financeiro:
    build: .
    image: meu-financeiro:latest
    container_name: meu-financeiro
    user: "10001:10001"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5005:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=0
      - APP_ENV=${APP_ENV:-production}
      - TRUSTED_PROXY=${TRUSTED_PROXY:-}
      - TRUSTED_PROXY_NETWORKS=${TRUSTED_PROXY_NETWORKS:-}
      - ENABLE_HSTS=${ENABLE_HSTS:-0}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-local}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_TOKEN_ENCRYPTION_KEY=${SUPABASE_TOKEN_ENCRYPTION_KEY:-}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      - SUPABASE_GOOGLE_ENABLED=${SUPABASE_GOOGLE_ENABLED:-1}
      - SECRET_KEY=${SECRET_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:5000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SSL=${SMTP_SSL:-0}
    volumes:
      - ./instance:/app/instance
      - ./uploads:/app/uploads
  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
